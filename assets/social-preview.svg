<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1016"/>
      <stop offset="1" stop-color="#161c24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0883e" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1060" cy="235" r="330" fill="url(#glow)"/>

  <!-- logo mark -->
  <rect x="72" y="64" width="80" height="80" rx="18" fill="#f0883e"/>
  <text x="112" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#0f1115" text-anchor="middle">R</text>

  <!-- wordmark -->
  <text x="180" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="80" font-weight="700" fill="#f4f6f8">RevRef</text>
  <text x="182" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#6e7681">review + refactoring pipeline</text>

  <!-- version pill -->
  <rect x="1090" y="76" width="118" height="42" rx="21" fill="none" stroke="#464e5a" stroke-width="2"/>
  <text x="1149" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#9aa4b2" text-anchor="middle">v3.12.0</text>

  <!-- loop motif -->
  <g fill="none" stroke-linecap="round">
    <path d="M 1060 150 A 105 105 0 0 1 1155 300" stroke="#f0883e" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M 1155 300 A 105 105 0 0 1 985 340" stroke="#969faf" stroke-opacity="0.35" stroke-width="5"/>
    <circle cx="1060" cy="150" r="6" fill="#f0883e" fill-opacity="0.75" stroke="none"/>
    <circle cx="1155" cy="300" r="6" fill="#f0883e" fill-opacity="0.75" stroke="none"/>
    <circle cx="985" cy="340" r="6" fill="#969faf" fill-opacity="0.55" stroke="none"/>
  </g>

  <!-- headline -->
  <text x="72" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#f4f6f8">The refactoring marathon</text>
  <text x="72" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#f4f6f8">for coding agents</text>

  <!-- accent rule -->
  <rect x="72" y="424" width="160" height="6" rx="3" fill="#f0883e"/>

  <!-- proof line -->
  <text x="72" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#9aa4b2">22 reviews  ·  independent verifiers  ·  main untouched</text>

  <!-- platforms -->
  <text x="72" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#6e7681">Claude Code  ·  DeepSeek Harness</text>

  <!-- pipeline W0 -> W9 -->
  <g>
    <text x="760" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#6e7681">W0  →  W9</text>
    <line x1="760" y1="574" x2="1208" y2="574" stroke="#3c434e" stroke-width="2"/>
    <circle cx="760" cy="574" r="7" fill="#f0883e"/>
    <circle cx="810" cy="574" r="4" fill="#5a626e"/>
    <circle cx="860" cy="574" r="7" fill="#f0883e"/>
    <circle cx="909" cy="574" r="4" fill="#5a626e"/>
    <circle cx="959" cy="574" r="4" fill="#5a626e"/>
    <circle cx="1009" cy="574" r="7" fill="#f0883e"/>
    <circle cx="1059" cy="574" r="4" fill="#5a626e"/>
    <circle cx="1108" cy="574" r="4" fill="#5a626e"/>
    <circle cx="1158" cy="574" r="4" fill="#5a626e"/>
    <circle cx="1208" cy="574" r="7" fill="#f0883e"/>
  </g>
</svg>
