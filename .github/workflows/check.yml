name: check

on:
  push:
  pull_request:

jobs:
  kit:
    name: Kit self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: References, structure, versions, ru/en parity
        run: python3 scripts/check_kit.py

  platforms:
    name: Hook and installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for test repositories
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Guard hook tests
        shell: bash
        run: sh scripts/test_guard.sh
      - name: install.sh
        shell: bash
        run: sh scripts/test_install.sh
      - name: install.ps1 (PowerShell 7)
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1
